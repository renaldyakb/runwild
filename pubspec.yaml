name: runwild
description: RUNWILD, pelacak jalan dan lari ramah pemula.
publish_to: none
version: 0.1.4+5

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.1.0
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: 7.1.0
  google_sign_in: 7.2.0
  permission_handler: 13.0.0
  geolocator: 14.1.2
  intl: 0.20.3
  package_info_plus: 10.2.2
  shared_preferences: 2.5.5
  drift: 2.35.4
  path_provider: 2.1.6
  flutter_map: 8.3.1
  latlong2: 0.9.1
  url_launcher: 6.3.2
  just_audio: 0.10.5
  audio_session: 0.2.2
  flutter_local_notifications: 23.0.2
  share_plus: 13.3.1
  image_picker: 1.1.2
  fl_chart: 1.3.1
  wakelock_plus: 1.8.0
  lottie: 3.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
    - assets/lottie/
  fonts:
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex_24pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/GoogleSansFlex_24pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/GoogleSansFlex_24pt-Light.ttf
          weight: 300
        - asset: assets/fonts/GoogleSansFlex_24pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSansFlex_24pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSansFlex_24pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/GoogleSansFlex_24pt-Black.ttf
          weight: 900
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Italic.ttf
          style: italic
