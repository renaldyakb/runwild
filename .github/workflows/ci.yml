name: Build & Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: runwild-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.version }}
          name: "RUNWILD ${{ steps.app_version.outputs.version }}"
          body: |
            ### RUNWILD — RUN. TRACK. IMPROVE. GO WILD. 🏃‍♂️⚡
            
            Versi rilis terbaru aplikasi RUNWILD dari branch `main`.
            
            #### 📦 Berkas Instalasi:
            - **`app-release.apk`**: APK Release Android resmi (siap diunduh dan dipasang langsung di HP).
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Code Analysis & Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test test/app_update_test.dart test/share_card_test.dart test/personal_best_alert_test.dart test/run_preferences_integration_test.dart test/profile_settings_test.dart test/run_permissions_test.dart test/weekly_goal_celebration_test.dart test/activity_detail_test.dart test/activity_sync_test.dart test/home_progress_test.dart test/tracking_engine_test.dart
